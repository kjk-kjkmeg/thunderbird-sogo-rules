<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css">
    <title>SOGo Rules Assistant</title>
  </head>
  <body>
    <h1>SOGo Rules Assistant</h1>
    <p id="mode">Lädt Einstellungen…</p>

    <section>
      <h2>Ordnerprognose</h2>
      <div id="suggestions">Noch keine Mail analysiert.</div>
      <label>
        Zielordner
        <input id="folder" value="INBOX/">
      </label>
    </section>

    <section>
      <h2>Kriterien</h2>
      <div class="criteria-grid header-row">
        <span>Aktiv</span><span>Feld</span><span>Operator</span><span>Wert</span>
      </div>
      <div id="criteria"></div>
      <button id="addCriterion" type="button">Kriterium hinzufügen</button>
    </section>

    <label>
      Regelname
      <input id="ruleName" value="Thunderbird SOGo Rule">
    </label>

    <label class="checkbox-row">
      <input id="applyToInbox" type="checkbox">
      Neue Regel nach dem Speichern auch sofort auf die aktuelle INBOX anwenden
    </label>
    <p class="hint">
      Wenn aktiv, wird zuerst der Zielordner angelegt, dann die Regel gespeichert und anschließend werden nur passende vorhandene INBOX-Mails verschoben.
    </p>

    <div class="button-row">
      <button id="analyze" type="button">Mail analysieren</button>
      <button id="preview" type="button">Preview bauen</button>
      <button id="apply" type="button" disabled>Nach WebMail/SOGo schreiben</button>
    </div>

    <pre id="output">Bereit.</pre>
    <script src="rule-model.js"></script>
    <script src="folder-predictor.js"></script>
    <script src="sogo-client.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
