name: Publish add-on updates

on:
  push:
    branches: [main]
    paths:
      - public/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish public/ to gh-pages branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          rm -rf /tmp/thunderbird-sogo-rules-pages
          git worktree add /tmp/thunderbird-sogo-rules-pages origin/gh-pages
          rsync -a --delete --exclude .git public/ /tmp/thunderbird-sogo-rules-pages/
          cd /tmp/thunderbird-sogo-rules-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No GitHub Pages changes to publish."
            exit 0
          fi
          git commit -m "chore: publish add-on updates"
          git push origin HEAD:gh-pages
